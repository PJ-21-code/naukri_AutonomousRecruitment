<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naukri.com HR & Recruitment Assistant</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="max-w-4xl mx-auto p-6 min-h-screen flex flex-col justify-between">
        <!-- Header -->
        <header class="bg-white shadow-sm rounded-xl p-4 mb-6 flex items-center justify-between border border-gray-100">
            <div>
                <h1 class="text-xl font-bold text-orange-600">Naukri.com Support Agent</h1>
                <p class="text-xs text-gray-500">LangGraph Offline RAG & Guardrails Demo</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-block w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-xs font-medium text-gray-600">MOCK_LLM Active</span>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="bg-white shadow-sm rounded-xl p-6 flex-1 flex flex-col border border-gray-100 mb-4 overflow-hidden">
            <div id="chat-history" class="flex-1 overflow-y-auto space-y-4 mb-4 pr-2 max-h-[500px]">
                <div class="flex justify-start">
                    <div class="bg-gray-100 rounded-2xl px-4 py-3 max-w-lg text-sm text-gray-700">
                        Hello! I am your Naukri.com recruitment assistant. How can I help you with policies, interviews, or application status today?
                    </div>
                </div>
            </div>

            <!-- Input Form -->
            <form id="chat-form" class="flex gap-2 pt-2 border-t border-gray-100">
                <input 
                    type="text" 
                    id="query-input" 
                    placeholder="Ask about notice period, interview process, or application status..." 
                    class="flex-1 border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent"
                    required
                >
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="bg-orange-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-orange-700 transition duration-150 shadow-sm"
                >
                    Send
                </button>
            </form>
        </main>

        <!-- Footer / Metadata display -->
        <footer class="text-center text-xs text-gray-400">
            Protected by PII Masking & Pydantic Schema Validation • Powered by FastAPI & LangGraph
        </footer>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const chatForm = document.getElementById('chat-form');
        const queryInput = document.getElementById('query-input');
        const submitBtn = document.getElementById('submit-btn');

        // Generate a random thread ID for session memory
        const threadId = "web_session_" + Math.random().toString(36).substring(2, 9);

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (!query) return;

            // Append User Message
            appendMessage(query, 'user');
            queryInput.value = '';
            queryInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Thinking...';

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, thread_id: threadId })
                });

                if (!response.ok) throw new Error('Failed to fetch response from agent.');

                const data = await response.json();
                
                // Format assistant response nicely including metadata info
                let responseHTML = `<p class="mb-2">${escapeHtml(data.answer)}</p>`;
                responseHTML += `<div class="text-[10px] text-gray-400 border-t border-gray-200/60 pt-1 mt-2 flex flex-wrap gap-x-3">`;
                responseHTML += `<span>Source: <b>${data.source_type}</b></span>`;
                responseHTML += `<span>Confidence: <b>${data.confidence_score}</b></span>`;
                responseHTML += `<span>Latency: <b>${data.latency_ms}ms</b></span>`;
                responseHTML += `</div>`;

                appendMessage(responseHTML, 'assistant', true);

            } catch (error) {
                appendMessage("Error: Could not reach the agent backend server.", 'assistant');
            } finally {
                queryInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send';
                queryInput.focus();
            }
        });

        function appendMessage(text, sender, isHTML = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = sender === 'user' 
                ? 'bg-orange-600 text-white rounded-2xl px-4 py-3 max-w-lg text-sm shadow-sm' 
                : 'bg-gray-100 text-gray-800 rounded-2xl px-4 py-3 max-w-lg text-sm border border-gray-200/50 shadow-sm';

            if (isHTML) {
                bubble.innerHTML = text;
            } else {
                bubble.textContent = text;
            }

            wrapper.appendChild(bubble);
            chatHistory.appendChild(wrapper);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
